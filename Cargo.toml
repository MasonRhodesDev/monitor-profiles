[package]
name = "monitor-profiles"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/MasonRhodesDev/monitor-profiles"
description = "Neutral monitor layout profiles: match connected displays, resolve geometry"
publish = false

[features]
default = []
# Hyprland adapter: generate `.lua`/`.conf` and parse legacy dialect files.
# Off by default so consumers that only READ profiles (a login screen) never
# compile compositor-specific syntax. Default parse/serialize stay TOML-only.
hyprland-render = []
# CLI config tool (list/show/validate/migrate/render).
cli = ["dep:clap", "hyprland-render"]

[[bin]]
name = "monitor-profiles"
path = "src/bin/monitor-profiles.rs"
required-features = ["cli"]

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
clap = { version = "4", features = ["derive"], optional = true }
